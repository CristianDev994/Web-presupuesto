<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="degradadoFondo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="degradadoAcento" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="128" fill="url(#degradadoFondo)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.25" />
  
  <!-- Billetera moderna estilizada -->
  <g transform="translate(64, 96)">
    <!-- Cuerpo billetera -->
    <rect x="32" y="64" width="320" height="220" rx="36" fill="#1e293b" stroke="#334155" stroke-width="8" />
    <!-- Tapa billetera -->
    <path d="M 32 100 C 32 76, 56 64, 80 64 L 304 64 C 328 64, 352 76, 352 100 L 352 130 L 32 130 Z" fill="#0f172a" opacity="0.6" />
    <!-- Tarjeta / Billete asomando -->
    <rect x="74" y="24" width="236" height="54" rx="14" fill="url(#degradadoAcento)" />
    <!-- Broche / Cierre -->
    <path d="M 270 144 L 352 144 C 368 144, 376 156, 376 174 C 376 192, 368 204, 352 204 L 270 204 C 256 204, 246 192, 246 174 C 246 156, 256 144, 270 144 Z" fill="#0f172a" stroke="#475569" stroke-width="6" />
    <!-- Moneda en el broche -->
    <circle cx="316" cy="174" r="16" fill="#38bdf8" />
  </g>
</svg>
